name: Schema

on:
  push:
  pull_request:

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: schema-diff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: clang --version
      - name: Verify clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          clang --version
      - name: Load the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Schema diff gate
        run: cargo test -p yashy-driver --test schema_diff
