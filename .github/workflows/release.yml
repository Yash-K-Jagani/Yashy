name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (without v)'
        required: true
      dry:
        description: 'Allow missing signing secrets; no draft release is created'
        type: boolean
        default: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify LLVM
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            $env:Path += ';C:\Program Files\LLVM\bin'
          }
          clang --version

      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: cargo build --release -p yashy-driver

      # A missing secret fails the job with the name of the secret, never
      # with an unsigned binary that looks like a release. A `dry` dispatch is
      # the one exception: it says so in the log and the run is not a release.
      - name: Check the signing secrets
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          DRY: ${{ inputs.dry }}
        run: |
          if ($env:DRY -eq 'true') {
            "SIGN=0" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host 'dry release: no Authenticode certificate; the archive is unsigned'
            exit 0
          }
          $missing = @()
          if (-not $env:CERT) { $missing += 'WINDOWS_CERT_PFX_BASE64' }
          if (-not $env:CERT_PASSWORD) { $missing += 'WINDOWS_CERT_PASSWORD' }
          if ($missing.Count -gt 0) {
            Write-Error "missing repository secret(s): $($missing -join ', ')"
            exit 1
          }
          "SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The signature has to cover the binary before it is packaged: the
      # archive ships the signed file.
      - name: Sign
        if: env.SIGN == '1'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'yashy.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          # /tr is the timestamping authority: without it the signature is
          # only valid while the certificate is, and a release outlives it.
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfx /p $env:CERT_PASSWORD target/release/yashy.exe
          signtool verify /pa /v target/release/yashy.exe
          Remove-Item -Force $pfx

      - name: Package
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          pwsh scripts/package-release.ps1 -Version $version

      - name: Upload the Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: yashy-windows
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version

      - name: Build
        run: cargo build --release -p yashy-driver

      - name: Package
        run: |
          version="${VERSION#v}"
          sh scripts/package-release.sh --version "$version"
          sh scripts/checksums.sh

      - name: Upload the Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: yashy-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # Run the packaged Linux artifact on the oldest glibc we promise, in a
  # container with no Rust toolchain. A release with one platform missing, or
  # one that only works on the build host, must not publish.
  package-smoke:
    needs: linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: yashy-linux
          path: dist

      - name: Checksum and stage the installer
        run: |
          sh scripts/checksums.sh
          cp scripts/install.sh dist/install.sh

      - name: Install and run in ubuntu:22.04
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:22.04 sh -c '
            apt-get update &&
            apt-get install -y clang llvm ca-certificates &&
            archive=$(ls /dist/yashy-*-x86_64-unknown-linux-gnu.tar.gz) &&
            YASHY_ARCHIVE="$archive" YASHY_SHA256SUMS=/dist/SHA256SUMS \
              sh /dist/install.sh --prefix /tmp/yashy --no-path &&
            /tmp/yashy/bin/yashy doctor &&
            /tmp/yashy/bin/yashy doctor --json &&
            /tmp/yashy/bin/yashy init /tmp/demo &&
            cd /tmp/demo && /tmp/yashy/bin/yashy test &&
            sh /dist/install.sh --uninstall --prefix /tmp/yashy --no-path &&
            test ! -d /tmp/yashy
          '

  # The macOS release: two archives, one for Apple silicon and one for Intel.
  # Each is signed with a Developer ID Application certificate, submitted to
  # Apple's notary, and stapled, so a machine that has never seen Yashy
  # accepts the binary without asking Apple's servers.
  macos:
    name: macos (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify LLVM
        run: |
          clang --version
          xcode-select -p

      # A missing secret fails the job with the name of the secret, never with
      # an unsigned artifact that looks like a release. The notary accepts
      # either an App Store Connect API key or an Apple ID with an
      # app-specific password; the key is the one that works in CI without a
      # human, so it is the preferred method.
      - name: Check the signing secrets
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          DRY: ${{ inputs.dry }}
        run: |
          set -eu
          if [ "$DRY" = "true" ]; then
            printf 'SIGN=0\nNOTARY=0\n' >> "$GITHUB_ENV"
            echo "dry release: no Developer ID identity; the archive is unsigned"
            exit 0
          fi
          missing=""
          [ -n "$CERT" ] || missing="$missing MACOS_CERT_P12_BASE64"
          [ -n "$CERT_PASSWORD" ] || missing="$missing MACOS_CERT_PASSWORD"
          if [ -n "$NOTARY_KEY" ] || [ -n "$NOTARY_KEY_ID" ]; then
            [ -n "$NOTARY_KEY" ] || missing="$missing MACOS_NOTARY_KEY_BASE64"
            [ -n "$NOTARY_KEY_ID" ] || missing="$missing MACOS_NOTARY_KEY_ID"
            notary="key"
          else
            [ -n "$APPLE_ID" ] || missing="$missing MACOS_APPLE_ID"
            [ -n "$APPLE_PASSWORD" ] || missing="$missing MACOS_APPLE_PASSWORD"
            [ -n "$TEAM_ID" ] || missing="$missing MACOS_TEAM_ID"
            notary="apple-id"
          fi
          if [ -n "$missing" ]; then
            echo "error: missing repository secret(s):$missing" >&2
            exit 1
          fi
          printf 'SIGN=1\nNOTARY=%s\n' "$notary" >> "$GITHUB_ENV"

      # The certificate lives in a throwaway keychain: the runner is
      # disposable, and the keychain dies with the job.
      - name: Import the signing certificate
        if: env.SIGN == '1'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          cert="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERT" | base64 --decode > "$cert"
          security create-keychain -p yashy-signing build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p yashy-signing build.keychain
          security import "$cert" -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k yashy-signing build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security find-identity -v -p codesigning

      # `notarytool submit` takes its credentials as flags (`--key`,
      # `--key-id`, `--issuer`) or as a keychain profile. A file on disk is
      # neither, so the API key is written here and its flags recorded; the
      # Apple ID route stores a real keychain profile instead.
      - name: Store the notary credentials
        if: env.NOTARY == 'key' || env.NOTARY == 'apple-id'
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -eu
          if [ "$NOTARY" = "key" ]; then
            key="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
            chmod 600 "$key"
            args="--key $key --key-id $NOTARY_KEY_ID"
            if [ -n "$NOTARY_ISSUER" ]; then
              args="$args --issuer $NOTARY_ISSUER"
            fi
            printf 'NOTARY_ARGS=%s\n' "$args" >> "$GITHUB_ENV"
          else
            xcrun notarytool store-credentials yashy-notary \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID"
            printf 'NOTARY_ARGS=--keychain-profile yashy-notary\n' >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --release -p yashy-driver --target "${{ matrix.target }}"

      # The runtime is C and the compiler links it, so the sign has to cover
      # the one binary the archive ships.
      - name: Sign
        if: env.SIGN == '1'
        run: |
          set -eu
          binary="target/${{ matrix.target }}/release/yashy"
          identity=$(security find-identity -v -p codesigning |
            grep 'Developer ID Application' | head -n 1 | sed 's/.*"\(.*\)"/\1/')
          [ -n "$identity" ] || { echo "error: no Developer ID Application identity" >&2; exit 1; }
          codesign --force --options runtime --timestamp \
            --sign "$identity" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

      - name: Package
        run: |
          version="${VERSION#v}"
          sh scripts/package-release.sh --version "$version" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/yashy"

      # The binary is notarised on its own first, so the copy inside the
      # archive carries its own ticket; the archive is then notarised and
      # stapled as well. A stapled ticket is what makes the download work
      # with no network.
      - name: Notarise and staple
        if: env.NOTARY != '0'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          version="${VERSION#v}"
          binary="target/$TARGET/release/yashy"
          archive="dist/yashy-$version-$TARGET.zip"
          # shellcheck disable=SC2086
          xcrun notarytool submit "$binary" $NOTARY_ARGS --wait
          xcrun stapler staple "$binary"
          xcrun stapler validate "$binary"
          # The archive now holds the stapled binary; rebuild it and submit
          # that, so the archive itself is notarised.
          sh scripts/package-release.sh --version "$version" --target "$TARGET" --binary "$binary"
          # shellcheck disable=SC2086
          xcrun notarytool submit "$archive" $NOTARY_ARGS --wait
          xcrun stapler staple "$archive"
          xcrun stapler validate "$archive"

      - name: Upload the macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: yashy-macos-${{ matrix.target }}
          path: dist/*.zip

  # The packaged macOS binary must work on a clean runner, and it must be
  # accepted by Gatekeeper there: a release that macOS refuses to open is
  # not a release.
  macos-install:
    needs: macos
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Download the macOS archive
        uses: actions/download-artifact@v4
        with:
          name: yashy-macos-aarch64-apple-darwin
          path: dist

      - name: Checksum and stage the installer
        run: |
          sh scripts/checksums.sh
          cp scripts/install.sh dist/install.sh

      - name: Install and run on a clean runner
        env:
          DRY: ${{ inputs.dry }}
        run: |
          archive=$(ls dist/yashy-*-aarch64-apple-darwin.zip)
          if [ "$DRY" = "true" ]; then
            sh scripts/test-install.sh --archive "$archive" --unsigned
          else
            sh scripts/test-install.sh --archive "$archive"
          fi

  publish:
    needs: [windows, linux, macos, macos-install, package-smoke]
    if: startsWith(github.ref, 'refs/tags/') || inputs.dry == true
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is the commits between the last two tags.
          fetch-depth: 0

      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          pattern: yashy-*
          path: dist
          merge-multiple: true

      - name: Write one checksum file for every archive
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            printf '%s' "$GPG_KEY" | base64 --decode > "$RUNNER_TEMP/release.key"
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --import "$RUNNER_TEMP/release.key"
            else
              gpg --batch --yes --import "$RUNNER_TEMP/release.key"
            fi
            rm -f "$RUNNER_TEMP/release.key"
            export YASHY_GPG_PASSPHRASE="$GPG_PASSPHRASE"
            sh scripts/checksums.sh --sign
          elif [ "$DRY" = "true" ]; then
            echo "dry release: no GPG key; SHA256SUMS is unsigned" >&2
            sh scripts/checksums.sh
          else
            echo "error: missing repository secret RELEASE_GPG_PRIVATE_KEY" >&2
            exit 1
          fi
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Write the changelog
        run: |
          version="${VERSION#v}"
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            printf '# Yashy %s\n\n' "$version"
            sh scripts/changelog.sh --since "$previous" --version "$version"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      # A draft, not a published release: the release is a decision a person
      # makes after reading the notes and the artifacts.
      - name: Publish the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            dist/install.sh
            dist/install.ps1

      # A dry run publishes nothing, but its bundle is what the install
      # matrix installs: one artifact with every file a release would carry.
      - name: Upload the dry release bundle
        if: inputs.dry == true
        uses: actions/upload-artifact@v4
        with:
          name: yashy-dry-release
          path: dist/*
