name: Bench

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Measure only and upload a candidate baseline
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    types: [labeled]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (${{ matrix.os }})
    # A PR runs only when it carries the `bench` label; scheduled and manual
    # runs always run.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            baseline: benchmarks/baselines/linux.bench
            output: benchmarks/build/current-linux.bench
          - os: windows-latest
            baseline: benchmarks/baselines/windows.bench
            output: benchmarks/build/current-windows.bench

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify clang (Linux)
        if: runner.os == 'Linux'
        run: clang --version

      - name: Verify clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          clang --version

      - name: Load the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the release compiler
        run: cargo build --release -p yashy-driver

      # Phase 4's gate calls the sanitizer corpus the proof that a pass keeps
      # semantics. It is a second run of the e2e programs, with the compiler
      # linking them under ASan and UBSan (YASHY_SANITIZE=1); the plain run and
      # this one are the differential pair. A sanitizer report is a FALSE
      # POSITIVE in the verifier's terms, so it fails the step.
      #
      # Serial on purpose. The first run of this step had 174 pass and two clang
      # subprocesses segfault at the same instant, at the end of a parallel run;
      # the corpus is about the generated program's semantics, not about how
      # many instrumented links the runner can hold at once. One test binary at
      # a time keeps the failures attributable to a program.
      - name: Differential sanitizer corpus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          YASHY_SANITIZE: '1'
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          cargo test -p yashy-driver --test e2e -- --test-threads=1 2>&1 | tee sanitizer-output.txt

      # Temporary: the two failing programs crash clang, and the driver's line
      # does not say whether cc1 or the linker died or which sanitizer is
      # responsible. Emit the IR, compile it with each flag combination, and
      # capture the exact link command. Removed once the cause is known.
      - name: Sanitizer crash forensics (Linux)
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          mkdir -p forensics
          clang --version > forensics/clang-version.txt 2>&1
          cat > forensics/debug-release.ya <<'EOF'
          fn main() {
              print("start");
              let n = 0;
              debug_assert(n > 0);
              print("checked");
              assert(n == 0);
              print("done");
          }
          EOF
          for name in buffer debug-release; do
            if [ "$name" = buffer ]; then
              src=crates/yashy-driver/tests/programs/buffer.ya
            else
              src=forensics/debug-release.ya
            fi
            ./target/release/yashy build "$src" --emit-ir > "forensics/$name.ll" 2> "forensics/$name-emit.err"
            echo "emit $name => $?" >> forensics/log.txt
            for flags in "-O2 -fsanitize=address,undefined" "-O1 -fsanitize=address,undefined" "-O2 -fsanitize=address" "-O2 -fsanitize=undefined" "-O0 -fsanitize=address,undefined"; do
              tag=$(echo "$flags" | tr -cd '[:alnum:]')
              clang $flags -fno-omit-frame-pointer -c "forensics/$name.ll" -o "forensics/$name-$tag.o" > "forensics/$name-$tag.log" 2>&1
              echo "cc $name $flags => $?" >> forensics/log.txt
            done
          done
          YASHY_SANITIZE=1 ./target/release/yashy build crates/yashy-driver/tests/programs/buffer.ya -o /tmp/buffer-asan > forensics/buffer-link.log 2>&1
          echo "link buffer => $?" >> forensics/log.txt
          if command -v strace >/dev/null; then
            YASHY_SANITIZE=1 strace -f -e trace=execve -s 20000 -o forensics/trace.txt ./target/release/yashy build crates/yashy-driver/tests/programs/buffer.ya -o /tmp/buffer-asan2 >/dev/null 2>&1
          fi
          cat forensics/log.txt

      # The release row the plan calls "PGO": the checked-in corpus built with
      # ThinLTO and with --pgo, correctness first, then the size and median
      # columns. `scripts/pgo.sh` is the runner the CLI reference names.
      - name: PGO report (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          BENCH_RUNS=5 sh scripts/pgo.sh benchmarks/build/pgo-linux.txt 2>&1 | tee pgo-output.txt

      - name: Measure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          BENCH_RUNS=5 sh benchmarks/ci.sh "${{ matrix.output }}" 2>&1 | tee bench-output.txt

      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh benchmarks/ci.ps1 -Output '${{ matrix.output }}' -Runs 5 2>&1 | Tee-Object -FilePath bench-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Git Bash puts its own `link.exe` ahead of the MSVC linker, so the
      # comparison runs under PowerShell on Windows. The measurement step is
      # already PowerShell and the release compiler links there.
      - name: Compare with the baseline (Linux)
        if: runner.os == 'Linux' && github.event.inputs.update_baseline != 'true'
        shell: bash
        env:
          REPORT_ONLY: ${{ github.event_name == 'pull_request' && '--report-only' || '' }}
        run: |
          cargo run -q -p yashy-bench -- compare \
            --baseline "${{ matrix.baseline }}" \
            --current "${{ matrix.output }}" \
            --thresholds benchmarks/thresholds.bench \
            $REPORT_ONLY

      - name: Compare with the baseline (Windows)
        if: runner.os == 'Windows' && github.event.inputs.update_baseline != 'true'
        shell: pwsh
        env:
          REPORT_ONLY: ${{ github.event_name == 'pull_request' && '--report-only' || '' }}
        run: |
          $arguments = @(
            'run', '-q', '-p', 'yashy-bench', '--', 'compare',
            '--baseline', '${{ matrix.baseline }}',
            '--current', '${{ matrix.output }}',
            '--thresholds', 'benchmarks/thresholds.bench'
          )
          if ($env:REPORT_ONLY) {
            $arguments += $env:REPORT_ONLY
          }
          cargo @arguments

      - name: Upload the measurement and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: |
            ${{ matrix.output }}
            bench-output.txt
            sanitizer-output.txt
            pgo-output.txt
            benchmarks/build/pgo-linux.txt
            forensics/
          if-no-files-found: warn
