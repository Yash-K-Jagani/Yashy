name: Install matrix

# The installer is the one part of the release a user touches first, so it is
# the part with the most platforms: every published release is installed on
# every platform it ships for, and the same happens weekly so a broken
# release is noticed before a user finds it.

on:
  release:
    types: [published]
  schedule:
    # Weekly, on Monday morning.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Where the artifacts come from'
        type: choice
        options:
          - release
          - run
        default: release
      run_id:
        description: 'Run id holding a yashy-dry-release bundle (mode: run)'
        required: false
      unsigned:
        description: 'Skip signature, notarisation and Gatekeeper assertions'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      # The published artifacts, not a fresh build: the question is whether
      # the release a user downloads works, and a build from this commit would
      # answer a different question. A `run` dispatch answers the same question
      # earlier, for a dry release's bundle that was never published.
      - name: Download the published artifacts
        if: inputs.mode != 'run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --pattern 'yashy-*' --dir dist || true
          gh release download --pattern 'SHA256SUMS*' --dir dist || true
          ls -l dist

      - name: Download a dry-release bundle
        if: inputs.mode == 'run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" \
            -n yashy-dry-release -D dist
          ls -l dist

      - name: Install and run (Linux)
        if: runner.os == 'Linux'
        run: |
          cp scripts/install.sh dist/install.sh
          archive=$(ls dist/yashy-*-x86_64-unknown-linux-gnu.tar.gz)
          sh scripts/test-install.sh --archive "$archive"

      - name: Install and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem dist/yashy-*-x86_64-pc-windows-msvc.zip | Select-Object -First 1).FullName
          pwsh scripts/test-install.ps1 -LocalArchive $archive

      - name: Install and run (macOS)
        if: runner.os == 'macOS'
        env:
          UNSIGNED: ${{ inputs.unsigned }}
        run: |
          cp scripts/install.sh dist/install.sh
          archive=$(ls dist/yashy-*-aarch64-apple-darwin.zip)
          # An unsigned archive is a supported state while no Developer ID
          # certificate exists, so ask the archive rather than assume. The
          # linker ad-hoc signs every arm64 Mach-O, so only a Developer ID
          # authority means the archive went through the notary; anything else
          # gets the install test with the signature assertions skipped and a
          # warning that names them.
          probe="$RUNNER_TEMP/probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          unzip -q "$archive" -d "$probe"
          if [ "$UNSIGNED" = "true" ] ||
            ! codesign -dv --verbose=4 "$probe"/*/yashy 2>&1 |
              grep -q '^Authority=Developer ID Application'; then
            echo "::warning::the archive is signed ad hoc, not with a Developer ID: signature, notarisation and Gatekeeper assertions are skipped"
            sh scripts/test-install.sh --archive "$archive" --unsigned
          else
            sh scripts/test-install.sh --archive "$archive"
          fi
