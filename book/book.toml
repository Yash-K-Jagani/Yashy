[book]
title = "The Yashy Book"
description = "A statically typed language that compiles to native binaries, with a verifier that proves ownership."
authors = ["The Yashy authors"]
language = "en"
src = "src"

[build]
create-missing = false
use-default-preprocessors = true

[output.html]
default-theme = "rust"
git-repository-url = "https://github.com/Yash-K-Jagani/Yashy"
no-section-label = false

[output.html.search]
enable = true
